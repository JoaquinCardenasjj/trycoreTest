services:
  postgres:
    image: postgres:16-alpine
    container_name: trycore-evm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trycore_evm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - trycore-evm-postgres-data:/var/lib/postgresql/data

volumes:
  trycore-evm-postgres-data:
